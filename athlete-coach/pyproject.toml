[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "athlete-coach"
version = "0.1.0"
description = "AI-powered athletics coach using Strava and Garmin data"
requires-python = ">=3.11"
dependencies = [
    "fitparse>=1.2.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    # Limpa as saídas dos notebooks no commit — ver .gitattributes
    "nbstripout>=0.7",
]
# Só os notebooks precisam disso — o pipeline de export roda sem nada disso aqui
notebooks = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "ipykernel>=6.29",
]

[tool.setuptools]
# Layout src/: o código fica em src/, não na raiz
package-dir = { "" = "src" }
# config.py é um módulo solto, não um pacote — precisa ser declarado à parte
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
